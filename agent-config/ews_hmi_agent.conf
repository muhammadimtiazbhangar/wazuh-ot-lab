<!--
  Centralised config for the HMI/EWS agent group.
  On the manager:  /var/ossec/etc/shared/ot-hmi-ews/agent.conf
  Assign agents:   /var/ossec/bin/agent_groups -a -i <AGENT_ID> -g ot-hmi-ews
  Adjust paths and project-file extensions to your OEM engineering tools.
-->
<agent_config os="Windows">

  <!-- Protect old HMIs: cap the event rate the agent sends -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>200</events_per_second>
  </client_buffer>

  <syscheck>
    <!-- UC2: PLC project files. whodata = user + process behind each change -->
    <directories whodata="yes" restrict=".ap17$|.ap18$|.ap19$|.ap20$|.ACD$|.s7p$">D:\PLC_Projects</directories>

    <!-- UC3: USB mass-storage history. Registry FIM runs on the scan schedule -->
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Enum\USBSTOR</windows_registry>
    <frequency>3600</frequency>
  </syscheck>

  <!-- UC5: custom hardening baseline (copy sca/ot_hmi_baseline.yml to the shared group folder) -->
  <sca>
    <policies>
      <policy>C:\Program Files (x86)\ossec-agent\shared\ot_hmi_baseline.yml</policy>
    </policies>
  </sca>

  <!-- Optional: Sysmon, only if the OEM approves it on this HMI -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
